<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forma Fit</title>
<meta name="description" content="Your personalized 12-week bodyweight coaching program with a daily video coach.">
<meta name="theme-color" content="#1F7A5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* main: #BEC5A4 (sage), second: #C97654 (terracotta) — every shade below is
     derived from these two, tuned so text/buttons stay readable (WCAG AA) in
     both light and dark mode. */
  --paper:#F5F6F1;
  --ink:#20241A;
  --ink-soft:#4B5443;
  --muted:#6A7264;
  --line:rgba(32,36,26,0.14);
  --brand:#6D764B;        /* solid fills — always dark enough for white text */
  --brand-deep:#565D3C;   /* pressed state / hero gradient's darker stop */
  --brand-soft:#E7E9E1;   /* pale surface for badges/pills */
  --brand-ink:#4A5033;    /* text drawn ON brand-soft or on the page itself */
  --accent:#C97654;       /* solid fills — pairs with the fixed dark chip text */
  --accent-ink:#804228;   /* text/borders/lines drawn on the page or a card */
  --card:#FFFFFF;
  --danger:#C53030;
  --shadow:0 1px 2px rgba(32,36,26,0.06), 0 8px 24px rgba(32,36,26,0.08);
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14140F;
    --ink:#F0F1EA;
    --ink-soft:#C3C7B8;
    --muted:#8B917E;
    --line:rgba(240,241,234,0.14);
    --brand:#6D764B;
    --brand-deep:#565D3C;
    --brand-soft:#313328;
    --brand-ink:#B4BD93;
    --accent:#C97654;
    --accent-ink:#D89479;
    --card:#201F19;
    --danger:#FF8080;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#14140F;
  --ink:#F0F1EA;
  --ink-soft:#C3C7B8;
  --muted:#8B917E;
  --line:rgba(240,241,234,0.14);
  --brand:#6D764B;
  --brand-deep:#565D3C;
  --brand-soft:#313328;
  --brand-ink:#B4BD93;
  --accent:#C97654;
  --accent-ink:#D89479;
  --card:#201F19;
  --danger:#FF8080;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; height:100%;}
html{height:100%;}
h1,h2,h3,.display{font-family:'Unbounded',system-ui,sans-serif; text-wrap:balance;}
.app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 16px; position:relative;}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); padding:18px 0 10px; display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:8px; font-family:'Unbounded',sans-serif; font-weight:600; font-size:1.05rem; letter-spacing:.01em;}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.iconbtn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.iconbtn:active{transform:scale(.94);}
main{flex:1; padding-bottom:96px;}
.screen{display:none;}
.screen.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.screen.active{animation:none;}}

.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow);}
.stack{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--brand-ink); background:var(--brand-soft); padding:4px 10px; border-radius:999px;}
.muted{color:var(--muted); font-size:.88rem;}
.btn{border:none; border-radius:14px; padding:14px 18px; font-family:'Unbounded',sans-serif; font-weight:600; font-size:.85rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; letter-spacing:.01em;}
.btn.primary{background:var(--brand); color:#fff; width:100%;}
.btn.primary:active{background:var(--brand-deep);}
.btn.accent{background:var(--accent); color:#241005;}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn.block{width:100%;}
.btn:disabled{opacity:.45; pointer-events:none;}
.btn.sm{padding:9px 14px; font-size:.72rem; border-radius:10px;}

/* Onboarding */
.onb-progress{display:flex; gap:6px; margin-bottom:18px;}
.onb-progress i{flex:1; height:4px; border-radius:99px; background:var(--line);}
.onb-progress i.done{background:var(--brand);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.opt{border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:14px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; text-align:left;}
.opt .emoji{font-size:1.4rem;}
.opt .lbl{font-weight:700; font-size:.9rem;}
.opt .sub{font-size:.74rem; color:var(--muted);}
.opt.selected{border-color:var(--brand); background:var(--brand-soft);}
.opt.full{grid-column:1/-1; flex-direction:row; align-items:center;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:.78rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select{border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:1rem; font-family:inherit;}
.unit-toggle{display:flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; width:fit-content;}
.unit-toggle button{border:none; background:var(--card); color:var(--ink); padding:8px 14px; font-weight:700; font-size:.8rem; cursor:pointer;}
.unit-toggle button.active{background:var(--brand); color:#fff;}

/* Tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:30; background:linear-gradient(to top, var(--paper) 70%, transparent);padding-top:14px;}
.tabbar-inner{max-width:480px; width:100%; margin:0 16px; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); display:flex; padding:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; border-radius:12px; cursor:pointer; color:var(--muted); background:none; border:none; font-family:inherit;}
.tab .ti{font-size:1.15rem;}
.tab .tl{font-size:.65rem; font-weight:700; letter-spacing:.02em;}
.tab.active{color:var(--brand-ink); background:var(--brand-soft);}

/* Today */
.hero{background:linear-gradient(135deg, var(--brand), var(--brand-deep)); color:#fff; border-radius:20px; padding:22px; position:relative; overflow:hidden;}
.hero .week{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; opacity:.85; font-weight:700;}
.hero h2{margin:6px 0 4px; font-size:1.4rem;}
.hero p{margin:0; opacity:.9; font-size:.88rem;}
.streak{display:flex; align-items:center; gap:6px; margin-top:14px; font-size:.8rem; font-weight:700;}
.dayrow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}
.daychip{flex:0 0 auto; width:42px; height:56px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:.68rem; font-weight:700; background:var(--card); border:1.5px solid var(--line); color:var(--muted);}
.daychip .dn{font-size:.6rem; text-transform:uppercase;}
.daychip.today{border-color:var(--accent-ink); color:var(--ink);}
.daychip.done{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-ink);}
.daychip.rest{opacity:.55;}
.exlist{display:flex; flex-direction:column; gap:8px;}
.exrow{display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--line); border-radius:14px; background:var(--card);}
.exrow .rig-mini{width:40px; height:40px; flex:0 0 auto;}
.exrow .exname{font-weight:700; font-size:.88rem;}
.exrow .exmeta{font-size:.75rem; color:var(--muted);}

/* Workout player */
.player{position:fixed; inset:0; background:var(--paper); z-index:50; display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));}
.player-top{display:flex; align-items:center; justify-content:space-between;}
.progress-track{height:6px; background:var(--line); border-radius:99px; margin:14px 0 4px; overflow:hidden;}
.progress-fill{height:100%; background:var(--brand); border-radius:99px; transition:width .3s ease;}
.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;}
.rig-wrap{width:min(72vw,260px); height:min(72vw,260px); background:var(--card); border-radius:28px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);}
.rig{width:70%; height:70%;}
.rig path,.rig circle,.rig line{stroke:var(--brand); stroke-width:7; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.rig .head{fill:var(--accent); stroke:none;}
.phaselabel{font-family:'Unbounded',sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink);}
.exercise-title{font-size:1.4rem; margin:2px 0;}
.timer{font-family:'Unbounded',sans-serif; font-size:3rem; font-variant-numeric:tabular-nums; margin:4px 0;}
.cue{color:var(--ink-soft); font-size:.9rem; max-width:320px;}
.player-controls{display:flex; gap:10px; margin-top:10px;}
.upnext{font-size:.78rem; color:var(--muted); margin-top:8px;}

/* Plan */
.weekblock{margin-bottom:6px;}
.weekhead{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; cursor:pointer;}
.weekhead .wt{font-weight:700; font-size:.92rem;}
.weekgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:2px 4px 12px;}
.wcell{aspect-ratio:1; border-radius:10px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; color:var(--muted); background:var(--card);}
.wcell.done{background:var(--brand); border-color:var(--brand); color:#fff;}
.wcell.rest{opacity:.4;}
.wcell.today{border-color:var(--accent-ink); color:var(--ink);}
.wcell.missed{border-color:var(--danger); color:var(--danger);}

/* Progress / chart */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}
.stat .sv{font-family:'Unbounded',sans-serif; font-size:1.5rem;}
.stat .sl{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.chartwrap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 12px;}
.logrow{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:.85rem;}
.logrow:last-child{border-bottom:none;}
.addweight{display:flex; gap:8px;}
.addweight input{flex:1;}

/* Profile */
.proflist .item{display:flex; justify-content:space-between; align-items:center; padding:13px 2px; border-bottom:1px solid var(--line); font-size:.9rem;}
.proflist .item:last-child{border-bottom:none;}
.switch{position:relative; width:42px; height:24px; border-radius:99px; background:var(--line); cursor:pointer; flex:0 0 auto;}
.switch.on{background:var(--brand);}
.switch i{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease;}
.switch.on i{left:20px;}
.toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:12px; font-size:.82rem; font-weight:600; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
a{color:var(--brand-ink);}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" hidden>
    <div class="brand"><span class="mark">F</span> Forma Fit</div>
    <button class="iconbtn" id="voiceToggleTop" title="Toggle voice coach">🔊</button>
  </div>

  <main>

    <!-- AUTH -->
    <section class="screen active" id="screen-auth">
      <div id="auth-content"></div>
    </section>

    <!-- ONBOARDING -->
    <section class="screen" id="screen-onboarding">
      <div id="onb-steps"></div>
    </section>

    <!-- TODAY -->
    <section class="screen" id="screen-today">
      <div class="stack" id="today-content"></div>
    </section>

    <!-- PLAN -->
    <section class="screen" id="screen-plan">
      <h2 style="margin:6px 0 14px;">Your 12-week plan</h2>
      <div id="plan-content"></div>
    </section>

    <!-- PROGRESS -->
    <section class="screen" id="screen-progress">
      <h2 style="margin:6px 0 14px;">Progress</h2>
      <div class="stack" id="progress-content"></div>
    </section>

    <!-- PROFILE -->
    <section class="screen" id="screen-profile">
      <h2 style="margin:6px 0 14px;">Profile</h2>
      <div class="stack" id="profile-content"></div>
    </section>

  </main>

  <div class="tabbar" id="tabbar" hidden>
    <div class="tabbar-inner">
      <button class="tab active" data-tab="today"><span class="ti">🏠</span><span class="tl">Today</span></button>
      <button class="tab" data-tab="plan"><span class="ti">🗓️</span><span class="tl">Plan</span></button>
      <button class="tab" data-tab="progress"><span class="ti">📈</span><span class="tl">Progress</span></button>
      <button class="tab" data-tab="profile"><span class="ti">👤</span><span class="tl">Profile</span></button>
    </div>
  </div>

  <div class="player" id="player" hidden></div>
  <div class="player" id="cycleModal" hidden></div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   FORMA FIT — 12-week bodyweight coaching program
   Data model (db): profile/main, weightlog/*, completions/*
   ========================================================= */

/* ---------- Exercise library ---------- */
// rig types: squat, pushup, jack, lunge, situp, bridge, climber, superman, plank, stretch, march, side
const EX = {
  jj:       {name:"Jumping Jacks", rig:"jack", cat:"cardio", cue:"Jump your feet out while raising your arms overhead, then snap back to start. Keep it light and quick."},
  high_knees:{name:"High Knees", rig:"march", cat:"cardio", cue:"Drive your knees up toward your chest at a quick jogging pace, pumping your arms."},
  squat:    {name:"Bodyweight Squat", rig:"squat", cat:"legs", cue:"Feet shoulder-width apart. Sit your hips back and down, chest up, then drive through your heels to stand."},
  lunge:    {name:"Alternating Lunges", rig:"lunge", cat:"legs", cue:"Step forward into a lunge, both knees at ninety degrees, then push back and switch legs."},
  glute_bridge:{name:"Glute Bridge", rig:"bridge", cat:"legs", cue:"Lie on your back, knees bent. Squeeze your glutes and lift your hips to the ceiling, then lower with control."},
  wall_sit: {name:"Wall Sit", rig:"squat_hold", cat:"legs", cue:"Back flat against a wall, slide down until your knees are at ninety degrees, and hold."},
  pushup:   {name:"Push-Up", rig:"pushup", cat:"upper", cue:"Hands under shoulders, body in a straight line. Lower your chest to the floor, then press back up. Drop to your knees any time."},
  incline_pushup:{name:"Incline Push-Up", rig:"pushup", cat:"upper", cue:"Hands on a raised surface, body straight. Lower your chest toward it, then press back up — easier on the shoulders."},
  plank:    {name:"Forearm Plank", rig:"plank", cat:"core", cue:"Forearms and toes on the floor, body in one straight line from head to heels. Brace your core and breathe."},
  side_plank:{name:"Side Plank", rig:"side", cat:"core", cue:"Stack your feet, prop up on one forearm, lift your hips so your body forms a straight line. Hold, then switch sides next round."},
  crunch:   {name:"Bicycle Crunch", rig:"situp", cat:"core", cue:"Hands behind your head, alternate bringing elbow to opposite knee in a smooth pedaling motion."},
  situp:    {name:"Sit-Up", rig:"situp", cat:"core", cue:"Knees bent, feet anchored. Curl your torso all the way up, then lower back down with control."},
  mountain_climber:{name:"Mountain Climbers", rig:"climber", cat:"cardio", cue:"In a plank position, drive your knees toward your chest quickly, alternating legs."},
  superman: {name:"Superman Hold", rig:"superman", cat:"back", cue:"Lie face down, lift your arms, chest and legs off the floor together, hold, then lower gently."},
  bird_dog: {name:"Bird Dog", rig:"birddog", cat:"back", cue:"On hands and knees, extend opposite arm and leg straight out, hold, then switch sides."},
  calf_raise:{name:"Calf Raises", rig:"march_slow", cat:"legs", cue:"Rise up onto your toes as high as you can, then lower slowly. Use a wall for balance if needed."},
  standing_side_crunch:{name:"Standing Side Crunch", rig:"side_stand", cat:"core", cue:"Bring your elbow and knee together at your side, alternating sides, standing tall between reps."},
  step_back_lunge:{name:"Reverse Lunges", rig:"lunge", cat:"legs", cue:"Step one foot back into a lunge, front knee at ninety degrees, then return to standing and alternate."},
  hip_circle:{name:"Standing Hip Circles", rig:"hip", cat:"warmup", cue:"Hands on hips, draw slow big circles with your hips to open up the joints."},
  arm_circle:{name:"Arm Circles", rig:"armcircle", cat:"warmup", cue:"Extend your arms out to the sides and draw small, controlled circles, forward then backward."},
  cat_cow:  {name:"Cat-Cow Stretch", rig:"catcow", cat:"cooldown", cue:"On hands and knees, arch your back up like a cat, then dip it down while lifting your chest, flowing slowly."},
  child_pose:{name:"Child's Pose", rig:"child", cat:"cooldown", cue:"Kneel and fold forward, arms reaching ahead, and breathe deeply as you relax into the stretch."},
  quad_stretch:{name:"Standing Quad Stretch", rig:"quadstretch", cat:"cooldown", cue:"Hold your ankle behind you, knees together, and gently press your hips forward. Switch sides halfway."},
  hamstring_stretch:{name:"Standing Hamstring Stretch", rig:"hamstretch", cat:"cooldown", cue:"Hinge from your hips with a soft bend in the knees, reaching toward your toes, and hold."},
  shoulder_tap:{name:"Plank Shoulder Taps", rig:"climber_slow", cat:"core", cue:"In a plank, tap your opposite shoulder with each hand, keeping your hips as still as possible."},
  march_step:{name:"Standing March", rig:"march_slow", cat:"warmup", cue:"March in place at an easy pace, swinging your arms to get your blood flowing."},
};

/* ---------- Track pools (goal-based) ---------- */
const TRACKS = {
  lose_weight:{ label:"Fat-Burn Circuits", desc:"Cardio-forward intervals to maximize calorie burn.",
    warmup:["march_step","hip_circle","arm_circle"],
    main:["jj","high_knees","mountain_climber","squat","lunge","crunch","shoulder_tap","step_back_lunge"],
    cooldown:["hamstring_stretch","quad_stretch","child_pose"], workSec:35, restSec:15, rounds:3 },
  gain_muscle:{ label:"Strength Builder", desc:"Controlled bodyweight strength work with fuller recovery.",
    warmup:["march_step","arm_circle","hip_circle"],
    main:["pushup","squat","glute_bridge","wall_sit","superman","plank","lunge","bird_dog"],
    cooldown:["quad_stretch","hamstring_stretch","child_pose"], workSec:40, restSec:25, rounds:3 },
  tone_tighten:{ label:"Tone & Tighten", desc:"Low-impact, joint-friendly toning inspired by wall-Pilates.",
    warmup:["hip_circle","arm_circle","march_step"],
    main:["glute_bridge","bird_dog","side_plank","standing_side_crunch","wall_sit","plank","calf_raise","incline_pushup"],
    cooldown:["cat_cow","child_pose","hamstring_stretch"], workSec:30, restSec:20, rounds:3 },
  general_fitness:{ label:"Balanced Fitness", desc:"A rotating mix of cardio, strength and core.",
    warmup:["march_step","hip_circle","arm_circle"],
    main:["jj","squat","pushup","plank","lunge","crunch","glute_bridge","mountain_climber","bird_dog"],
    cooldown:["cat_cow","quad_stretch","child_pose"], workSec:35, restSec:20, rounds:3 },
};

const FOCUS_EXTRA = {
  full_body:[], abs_core:["crunch","plank","side_plank","standing_side_crunch"],
  legs_glutes:["squat","lunge","glute_bridge","wall_sit","step_back_lunge"],
  arms_back:["pushup","incline_pushup","superman","bird_dog","shoulder_tap"],
};

const GOAL_META = {
  lose_weight:{emoji:"🔥", label:"Lose weight"},
  gain_muscle:{emoji:"💪", label:"Gain muscle"},
  tone_tighten:{emoji:"✨", label:"Tone & tighten"},
  general_fitness:{emoji:"⚖️", label:"General fitness"},
};
const HEALTH_META = {
  none:{emoji:"✅", label:"None of these"},
  back:{emoji:"🦴", label:"Back issues"},
  knees:{emoji:"🦵", label:"Knee issues"},
  shoulders:{emoji:"🤷", label:"Shoulder issues"},
  wrists:{emoji:"✋", label:"Wrist issues"},
  pregnant_postpartum:{emoji:"🤰", label:"Pregnant / postpartum"},
};
// exercises excluded per flagged condition, so the program avoids loading that area
const HEALTH_EXCLUDE = {
  back:["situp","crunch"],
  knees:["squat","lunge","step_back_lunge","jj","high_knees","mountain_climber","wall_sit"],
  shoulders:["pushup","incline_pushup","plank","side_plank","shoulder_tap"],
  wrists:["pushup","incline_pushup","plank","side_plank","bird_dog","shoulder_tap"],
  pregnant_postpartum:["situp","crunch","jj","high_knees","mountain_climber","superman"],
};
function getExcludedIds(profile){
  const s = new Set();
  (profile.healthConditions||[]).forEach(c=>{ (HEALTH_EXCLUDE[c]||[]).forEach(id=>s.add(id)); });
  (profile.avoidExercises||[]).forEach(id=>s.add(id));
  return s;
}
function safeFilter(list, excluded){
  const f = list.filter(id=>!excluded.has(id));
  return f.length ? f : list; // never leave an empty pool — fall back rather than break the day
}

/* Fit the day's workout structure (exercise count, rounds, work/rest) to the
   minutes the person told us they have, while phase/cycle still push the
   work:rest ratio harder over time so the same time budget gets more done. */
function computeSessionParams(profile, track, phase, cycleBump, excluded){
  const sessionMinutes = profile.sessionMinutes || 30;
  const totalSec = sessionMinutes*60;
  const short = sessionMinutes<=20;
  const warmupCount = short?2:3;
  const cooldownCount = short?2:3;
  const trimSec = short?20:30;
  const warmupPool = safeFilter(track.warmup, excluded);
  const cooldownPool = safeFilter(track.cooldown, excluded);
  const warmup = warmupPool.slice(0,warmupCount).map(id=>({id, sec:trimSec}));
  const cooldown = cooldownPool.slice(0,cooldownCount).map(id=>({id, sec:trimSec}));
  const fixedSec = (warmupCount+cooldownCount)*trimSec;
  const mainBudget = Math.max(60, totalSec-fixedSec);
  const n = sessionMinutes<=20?4:(sessionMinutes<=35?5:6);

  const workSec = track.workSec + phase*5 + cycleBump*3;
  const restSec = Math.max(10, track.restSec - phase*5 - Math.min(cycleBump,2)*3);
  let rounds = Math.round(mainBudget/(n*(workSec+restSec)));
  rounds = Math.max(1, Math.min(rounds,6));

  return {warmup, cooldown, n, workSec, restSec, rounds};
}

/* ---------- Program generation (pure, deterministic) ---------- */
const CYCLE_DAYS = 84; // 12 weeks
function currentCycleIndex(){ return Math.floor(currentDayIndex()/CYCLE_DAYS); }

function generateDay(profile, dayIndex){
  const cycleIndex = Math.floor(dayIndex/CYCLE_DAYS);
  const dic = ((dayIndex%CYCLE_DAYS)+CYCLE_DAYS)%CYCLE_DAYS; // day-in-cycle 0..83
  const week = Math.floor(dic/7); // 0..11
  const slot = dic%7;
  const template = DAY_TEMPLATES[profile.daysPerWeek] || DAY_TEMPLATES[4];
  const isWorkout = template[slot];
  const weekNum = week+1;
  if(!isWorkout) return {dayIndex, weekNum, cycleIndex, rest:true};

  const track = TRACKS[profile.goal] || TRACKS.general_fitness;
  const excluded = getExcludedIds(profile);
  let pool = track.main.slice();
  (profile.focusAreas||[]).forEach(f=>{ (FOCUS_EXTRA[f]||[]).forEach(e=>{ if(!pool.includes(e)) pool.push(e); if(pool.filter(x=>x===e).length<2) pool.push(e); }); });
  pool = safeFilter(pool, excluded);

  // phase progression within a cycle: 0=weeks1-4, 1=weeks5-8, 2=weeks9-12
  const phase = week<4?0:(week<8?1:2);
  // each completed 12-week cycle nudges the baseline intensity up a little further, capped
  const cycleBump = Math.min(cycleIndex,3);
  const sp = computeSessionParams(profile, track, phase, cycleBump, excluded);

  // pick main exercises for the day (count fit to session length), rotating through
  // the pool by workout-day count so consecutive sessions don't repeat the same set
  const workoutDayCount = countWorkoutDaysBefore(profile, dayIndex);
  const main = [];
  for(let i=0;i<sp.n;i++){ main.push(pool[(workoutDayCount*3 + i) % pool.length]); }

  return {
    dayIndex, weekNum, cycleIndex, rest:false, phase,
    trackLabel: track.label,
    sessionMinutes: profile.sessionMinutes||30,
    warmup: sp.warmup,
    main: main.map(id=>({id, sec:sp.workSec, restSec:sp.restSec})),
    rounds: sp.rounds,
    cooldown: sp.cooldown,
  };
}
function countWorkoutDaysBefore(profile, dayIndex){
  const template = DAY_TEMPLATES[profile.daysPerWeek] || DAY_TEMPLATES[4];
  let c=0;
  for(let d=0; d<dayIndex; d++){ if(template[d%7]) c++; }
  return c;
}

  for(let r=0;r<day.rounds;r++){
    day.main.forEach(e=>{
      q.push({sec:e.sec, kind:`Round ${r+1} of ${day.rounds}`, id:e.id, isRest:false});
      q.push({rest:true, isRest:true, sec:e.restSec, kind:`Round ${r+1} of ${day.rounds}`, forId:e.id});
    });
  }
  day.cooldown.forEach(e=>q.push({...e, kind:'Cooldown', id:e.id, isRest:false}));
  return q;
}
function fmtClock(sec){ sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function startWorkout(day){
  const queue = buildQueue(day);
  playerState = {day, queue, i:0, timer:null, remaining:0, paused:false, totalElapsedSec:0, skipped:{}};
  $('#player').hidden = false;
  renderPlayerStep();
}
function renderPlayerStep(){
  const {queue,i} = playerState;
  const item = queue[i];
  if(!item){ finishWorkout(); return; }
  playerState.remaining = item.sec;
  const total = queue.length;
  const pct = Math.round((i/total)*100);
  const isRest = !!item.rest;
  const ex = isRest?null:EX[item.id];

  $('#player').innerHTML = `
    <div class="player-top">
      <button class="iconbtn" id="playerClose">✕</button>
      <span class="muted" style="font-size:.8rem;">${item.kind}</span>
      <button class="iconbtn" id="playerVoice">${voiceOn?'🔊':'🔇'}</button>
    </div>
    <div class="row" style="margin-top:6px;">
      <span class="muted" style="font-size:.76rem;">⏱ Total <span id="overallTimer" style="font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);">${fmtClock(playerState.totalElapsedSec)}</span></span>
      <span class="muted" style="font-size:.76rem;">${i+1} / ${total}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="stage">
      <div class="phaselabel">${isRest?'Rest':'Work'}</div>
      <div class="rig-wrap">${isRest? restRig() : rigSvg(ex.rig,true)}</div>
      <h2 class="exercise-title">${isRest?'Rest':ex.name}</h2>
      <div class="timer" id="timerNum">${item.sec}</div>
      <p class="cue">${isRest?'Catch your breath — next one is coming up.':ex.cue}</p>
      <div class="upnext">${nextLabel()}</div>
    </div>
    <div class="player-controls">
      <button class="btn ghost block" id="pauseBtn">Pause</button>
      <button class="btn primary block" id="skipBtn">${isRest?'Skip rest':'Skip exercise'}</button>
    </div>
  `;
  $('#playerClose').onclick = ()=>{ stopTimer(); if(confirm('End this workout early?')) closePlayer(); else renderPlayerStep(); };
  $('#skipBtn').onclick = skipCurrent;
  $('#pauseBtn').onclick = togglePause;
  $('#playerVoice').onclick = ()=>{ voiceOn=!voiceOn; try{localStorage.setItem('ff_voice', voiceOn?'on':'off');}catch(e){} updateVoiceIcon(); renderPlayerStep(); };

  if(!isRest) speak(`${ex.name}. ${ex.cue}`); else speak('Rest.');
  runTimer();
}
function nextLabel(){
  const {queue,i} = playerState;
  const nxt = queue[i+1];
  if(!nxt) return 'Last one — finish strong!';
  return nxt.rest ? 'Up next: rest' : 'Up next: '+EX[nxt.id].name;
}
function skipCurrent(){
  const {queue,i} = playerState;
  const item = queue[i];
  if(!item.rest){
    // remember this exercise was skipped (asked about once, after the workout)
    if(!playerState.skipped[item.id]) playerState.skipped[item.id] = {name:EX[item.id].name};
    // drop every later occurrence of this same exercise (and its paired rest) for the rest of this session
    for(let j=queue.length-1;j>i;j--){
      if((queue[j].id===item.id && !queue[j].rest) || (queue[j].rest && queue[j].forId===item.id)) queue.splice(j,1);
    }
  }
  stopTimer(); playerState.i++; renderPlayerStep();
}
function runTimer(){
  stopTimer();
  playerState.timer = setInterval(()=>{
    if(playerState.paused) return;
    playerState.remaining--;
    playerState.totalElapsedSec++;
    const el = $('#timerNum'); if(el) el.textContent = Math.max(playerState.remaining,0);
    const ot = $('#overallTimer'); if(ot) ot.textContent = fmtClock(playerState.totalElapsedSec);
    if(playerState.remaining<=3 && playerState.remaining>0) speak(String(playerState.remaining));
    if(playerState.remaining<=0){ stopTimer(); playerState.i++; renderPlayerStep(); }
  },1000);
}
function stopTimer(){ if(playerState && playerState.timer){ clearInterval(playerState.timer); playerState.timer=null; } }
function togglePause(){
  playerState.paused = !playerState.paused;
  $('#pauseBtn').textContent = playerState.paused?'Resume':'Pause';
  if(playerState.paused){ try{window.speechSynthesis.cancel();}catch(e){} }
}
async function finishWorkout(){
  await markComplete(playerState.day.dayIndex);
  const skippedList = Object.entries(playerState.skipped||{}).map(([id,info])=>({id,name:info.name}));
  if(skippedList.length){ runSkipSurvey(skippedList, 0); }
  else { showCompletionScreen(); }
}
const SKIP_REASONS = [
  {k:'too_hard', label:"Too hard / couldn't do it"},
  {k:'pain', label:'Caused pain or discomfort'},
  {k:'disliked', label:"Didn't like this one"},
  {k:'no_time', label:'Ran out of time'},
  {k:'other', label:'Other reason'},
];
function runSkipSurvey(list, idx){
  if(idx>=list.length){ showCompletionScreen(); return; }
  const item = list[idx];
  $('#player').innerHTML = `
    <div class="stage">
      <div class="phaselabel">Quick feedback</div>
      <h2 class="exercise-title">You skipped "${item.name}"</h2>
      <p class="cue">Why did you skip it? We'll use this to adjust future workouts.</p>
      <div class="stack" style="width:100%;max-width:320px;margin-top:8px;">
        ${SKIP_REASONS.map(r=>`<button class="btn ghost block" data-reason="${r.k}">${r.label}</button>`).join('')}
      </div>
    </div>`;
  $$('#player [data-reason]').forEach(b=>b.onclick=async ()=>{
    const reason = b.dataset.reason;
    await addFeedback({date:todayStr(), exerciseId:item.id, exerciseName:item.name, reason});
    if(reason==='pain' || reason==='too_hard'){
      const avoid = new Set(profile.avoidExercises||[]);
      avoid.add(item.id);
      await saveProfile({...profile, avoidExercises:Array.from(avoid)});
      showToast(reason==='pain' ? "Noted — we'll avoid this one from now on." : "Noted — we'll swap this one out going forward.");
    }
    runSkipSurvey(list, idx+1);
  });
}
function showCompletionScreen(){
  speak('Workout complete. Great work.');
  $('#player').innerHTML = `
    <div class="stage">
      <div style="font-size:3rem;">🎉</div>
      <h2 class="exercise-title">Workout complete!</h2>
      <p class="cue">Nice work — ${fmtClock(playerState.totalElapsedSec)} logged for ${fmtDate(todayStr())}. See you next session.</p>
      <button class="btn primary" id="playerDoneBtn" style="margin-top:18px;">Done</button>
    </div>`;
  $('#playerDoneBtn').onclick = closePlayer;
}
function closePlayer(){
  stopTimer(); try{window.speechSynthesis.cancel();}catch(e){}

}

/* ---------- PLAN screen ---------- */
let planViewCycle = null;
function renderPlan(){
  const idx = currentDayIndex();
  const curCycle = currentCycleIndex();
  if(planViewCycle===null) planViewCycle = curCycle;
  const base = planViewCycle*CYCLE_DAYS;

  let html = `<div class="row" style="margin-bottom:12px;">
    <button class="iconbtn" id="planPrev" ${planViewCycle<=0?'disabled':''}>‹</button>
    <div style="text-align:center;">
      <strong>Cycle ${planViewCycle+1}</strong>
      ${planViewCycle===curCycle?'<div class="muted" style="font-size:.72rem;">Current</div>':(planViewCycle<curCycle?'<div class="muted" style="font-size:.72rem;">Completed</div>':'<div class="muted" style="font-size:.72rem;">Upcoming</div>')}
    </div>
    <button class="iconbtn" id="planNext">›</button>
  </div>`;

  for(let w=0; w<12; w++){
    let cells = '';
    for(let d=0; d<7; d++){
      const di = base + w*7+d;
      const day = generateDay(profile, di);
      const isDone = !!completions[String(di)];
      const isToday = di===idx;
      const isMissed = di<idx && !day.rest && !isDone;
      let cls='wcell';
      if(day.rest) cls+=' rest';
      if(isDone) cls+=' done';
      if(isToday) cls+=' today';
      if(isMissed) cls+=' missed';
      cells += `<div class="${cls}" title="${day.rest?'Rest':day.trackLabel}">${day.rest?'–':(isDone?'✓':['M','T','W','T','F','S','S'][d])}</div>`;
    }
    html += `<div class="weekblock"><div class="card"><div class="weekhead"><span class="wt">Week ${w+1}</span><span class="muted" style="font-size:.78rem;">${w<4?'Foundation':w<8?'Build':'Peak'}</span></div><div class="weekgrid">${cells}</div></div></div>`;
  }
  $('#plan-content').innerHTML = html;
  $('#planPrev').onclick = ()=>{ if(planViewCycle>0){ planViewCycle--; renderPlan(); } };
  $('#planNext').onclick = ()=>{ planViewCycle++; renderPlan(); };
}

/* ---------- PROGRESS screen ---------- */
function renderProgress(){
  const completedCount = Object.keys(completions).length;
  const idx = currentDayIndex();
  let totalWorkoutsSoFar=0;
  for(let d=0; d<=idx; d++){ if(!generateDay(profile,d).rest) totalWorkoutsSoFar++; }
  const last = weightLog[weightLog.length-1];
  const first = weightLog[0];
  const lost = first && last ? (first.weight - last.weight) : 0;

  $('#progress-content').innerHTML = `
    <div class="statgrid">
      <div class="stat"><div class="sv">${completedCount}</div><div class="sl">Workouts done</div></div>
      <div class="stat"><div class="sv">${computeStreak()}</div><div class="sl">Day streak</div></div>
      <div class="stat"><div class="sv">${last?last.weight:'—'}${profile.unit}</div><div class="sl">Current weight</div></div>
      <div class="stat"><div class="sv">${lost>0?'-':lost<0?'+':''}${Math.abs(lost).toFixed(1)}${profile.unit}</div><div class="sl">Since start</div></div>
    </div>
    <div class="chartwrap">${weightChart()}</div>
    <div class="card">
      <div class="row"><strong>Weight log</strong>
        <div class="addweight" style="width:auto;"><input type="number" inputmode="decimal" id="pwInput" style="width:90px;" placeholder="${profile.unit}"><button class="btn accent sm" id="pwBtn">Add</button></div>
      </div>
      <div id="logList" style="margin-top:8px;">${weightLog.slice().reverse().slice(0,10).map(e=>`<div class="logrow"><span>${fmtDate(e.date)}</span><strong>${e.weight}${profile.unit}</strong></div>`).join('') || '<p class="muted">No entries yet.</p>'}</div>
    </div>
  `;
  $('#pwBtn').onclick = async ()=>{
    const v=$('#pwInput').value; if(!v||Number(v)<=0) return;
    await addWeightEntry(v); showToast('Weight logged'); renderProgress();
  };
}
function weightChart(){
  if(weightLog.length<2) return `<p class="muted" style="text-align:center;margin:20px 0;">Log a couple more entries to see your trend.</p>`;
  const w=300,h=140,pad=24;
  const vals = weightLog.map(e=>e.weight);
  const min = Math.min(...vals, profile.targetWeight)-1, max = Math.max(...vals, profile.currentWeight)+1;
  const pts = weightLog.map((e,i)=>{
    const x = pad + (i/(weightLog.length-1))*(w-2*pad);
    const y = h-pad - ((e.weight-min)/(max-min||1))*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const goalY = h-pad - ((profile.targetWeight-min)/(max-min||1))*(h-2*pad);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <line x1="${pad}" y1="${goalY.toFixed(1)}" x2="${w-pad}" y2="${goalY.toFixed(1)}" stroke="var(--accent-ink)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${w-pad}" y="${goalY-6}" text-anchor="end" font-size="9" fill="var(--accent-ink)">Goal ${profile.targetWeight}${profile.unit}</text>
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--brand)"/>`).join('')}
  </svg>`;
}

}

.anim-climber .legL{animation:climb-l 0.7s ease-in-out infinite;}
.anim-climber .legR{animation:climb-r 0.7s ease-in-out infinite .35s;}
@keyframes climb-l{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px) translateX(4px);}}
@keyframes climb-r{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px) translateX(-4px);}}
.anim-climber_slow .legL{animation:climb-l 1.4s ease-in-out infinite;}
.anim-climber_slow .legR{animation:climb-r 1.4s ease-in-out infinite .7s;}

.anim-superman .arms{animation:superman-arms 1.6s ease-in-out infinite;}
.anim-superman .legs{animation:superman-legs 1.6s ease-in-out infinite;}
@keyframes superman-arms{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes superman-legs{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

.anim-birddog .armR{animation:bd-arm 1.8s ease-in-out infinite;}
.anim-birddog .legL{animation:bd-leg 1.8s ease-in-out infinite;}
@keyframes bd-arm{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px) translateX(6px);}}
@keyframes bd-leg{0%,100%{transform:translateY(0);}50%{transform:translateY(6px) translateX(-6px);}}

.anim-plank .rig-body{animation:plank-breathe 2.2s ease-in-out infinite; transform-origin:50px 55px;}
@keyframes plank-breathe{0%,100%{transform:rotate(-6deg) scale(1);}50%{transform:rotate(-6deg) scale(1.02);}}

.anim-side .rig-body{animation:plank-breathe 2.2s ease-in-out infinite; transform-origin:50px 55px; }
.anim-side_stand .armL{animation:side-crunch 1.3s ease-in-out infinite;}
.anim-side_stand .legR{animation:side-crunch-leg 1.3s ease-in-out infinite;}
@keyframes side-crunch{0%,100%{transform:translate(0,0);}50%{transform:translate(6px,10px);}}
@keyframes side-crunch-leg{0%,100%{transform:translate(0,0);}50%{transform:translate(-4px,-10px);}}

.anim-march .legL{animation:march-l 0.8s ease-in-out infinite;}
.anim-march .legR{animation:march-r 0.8s ease-in-out infinite .4s;}
@keyframes march-l{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
@keyframes march-r{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.anim-march_slow .legL{animation:march-l 1.6s ease-in-out infinite;}
.anim-march_slow .legR{animation:march-r 1.6s ease-in-out infinite .8s;}

.anim-hip .rig-body{animation:hip-circle 2s ease-in-out infinite;}
@keyframes hip-circle{0%{transform:translateX(0);}25%{transform:translateX(6px);}50%{transform:translateX(0) translateY(4px);}75%{transform:translateX(-6px);}100%{transform:translateX(0);}}

.anim-armcircle .arms{animation:arm-circle 1.5s linear infinite; transform-origin:50px 34px;}
@keyframes arm-circle{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

.anim-catcow .torso{animation:catcow-move 2.2s ease-in-out infinite; transform-origin:50px 55px;}
@keyframes catcow-move{0%,100%{transform:rotate(0deg) translateY(0);}50%{transform:rotate(8deg) translateY(-4px);}}

.anim-child .rig-body{transform:scale(.85) translateY(14px) rotate(4deg);}

.anim-quadstretch .legR{animation:quad-stretch 2s ease-in-out infinite;}
@keyframes quad-stretch{0%,100%{transform:translate(0,0);}50%{transform:translate(6px,-10px);}}

.anim-hamstretch .rig-body{animation:ham-stretch 2s ease-in-out infinite; transform-origin:50px 60px;}
@keyframes ham-stretch{0%,100%{transform:rotate(0deg);}50%{transform:rotate(20deg);}}

.anim-rest .rig-body{animation:rest-breathe 2.4s ease-in-out infinite;}
@keyframes rest-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

@media (prefers-reduced-motion: reduce){
  .rig-body, .arms, .legs, .armL, .armR, .legL, .legR, .torso{animation:none !important;}
}
</style>

<script>
/* ---------- Auth screen ---------- */
function renderAuthScreen(mode, error){
  mode = mode || 'login';
  const isSignup = mode==='signup';
  const isReset = mode==='reset';
  $('#auth-content').innerHTML = `
    <div style="padding-top:12vh;max-width:360px;margin:0 auto;">
      <div class="brand" style="justify-content:center;font-size:1.3rem;margin-bottom:6px;"><span class="mark">F</span> Forma Fit</div>
      <p class="muted" style="text-align:center;margin:0 0 24px;">${isReset?'Reset your password':(isSignup?'Create an account to start your program':'Log in to continue your program')}</p>
      <div class="card stack">
        <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></div>
        ${!isReset?`<div class="field"><label>Password</label><input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="${isSignup?'new-password':'current-password'}"></div>`:''}
        ${error?`<p style="color:var(--danger);font-size:.82rem;margin:0;">${error}</p>`:''}
        <button class="btn primary block" id="authSubmitBtn">${isReset?'Send reset email':(isSignup?'Create account':'Log in')}</button>
      </div>
      <div style="text-align:center;margin-top:16px;font-size:.85rem;">
        ${isReset?`<a href="#" id="authBackLink">Back to log in</a>`
          :(isSignup?`Already have an account? <a href="#" id="authToggleLink">Log in</a>`
          :`New here? <a href="#" id="authToggleLink">Create an account</a> &nbsp;·&nbsp; <a href="#" id="authResetLink">Forgot password?</a>`)}
      </div>
    </div>`;
  $('#authSubmitBtn').onclick = async ()=>{
    const email = $('#authEmail').value.trim();
    if(!email){ renderAuthScreen(mode,'Enter your email.'); return; }
    try{
      if(isReset){
        await auth.sendPasswordResetEmail(email);
        renderAuthScreen('login', null);
        showToast('Password reset email sent.');
        return;
      }
      const password = $('#authPassword').value;
      if(!password || password.length<6){ renderAuthScreen(mode,'Password must be at least 6 characters.'); return; }
      if(isSignup){ await auth.createUserWithEmailAndPassword(email,password); }
      else { await auth.signInWithEmailAndPassword(email,password); }
      // onAuthStateChanged takes it from here
    }catch(e){ renderAuthScreen(mode, authErrorMessage(e)); }
  };
  if($('#authToggleLink')) $('#authToggleLink').onclick = (e)=>{ e.preventDefault(); renderAuthScreen(isSignup?'login':'signup'); };
  if($('#authResetLink')) $('#authResetLink').onclick = (e)=>{ e.preventDefault(); renderAuthScreen('reset'); };
  if($('#authBackLink')) $('#authBackLink').onclick = (e)=>{ e.preventDefault(); renderAuthScreen('login'); };
}
function authErrorMessage(e){
  const map = {
    'auth/invalid-email':'That email address looks invalid.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/email-already-in-use':'An account already exists with that email — try logging in instead.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/configuration-not-found':'Email/Password sign-in isn\'t enabled yet for this Firebase project — enable it under Authentication > Sign-in method.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'This app\'s Firebase config hasn\'t been filled in yet — see SETUP.md.',
  };
  return map[e.code] || (e.message || 'Something went wrong. Please try again.');
}

/* ---------- Boot ---------- */
(function boot(){
  initFirebase();
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      currentUser = user;
      $('#topbar').hidden = true; $('#tabbar').hidden = true;
      $$('.screen').forEach(s=>s.classList.remove('active'));
      profile = await loadProfile();
      if(profile){
        weightLog = await loadWeightLog();
        completions = await loadCompletions();
        enterApp();
      } else {
        $('#screen-onboarding').classList.add('active');
        renderOnboarding();
      }
    } else {
      currentUser = null; profile = null; weightLog = []; completions = {};
      $('#topbar').hidden = true; $('#tabbar').hidden = true;
      $$('.screen').forEach(s=>s.classList.remove('active'));
      $('#screen-auth').classList.add('active');
      renderAuthScreen('login');
    }
  });
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>

</body>
</html>
